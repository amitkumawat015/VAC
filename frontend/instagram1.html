<!DOCTYPE html>
<html>
<head>
    <title>Instagram Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: linear-gradient(
                45deg,
                #feda75,
                #fa7e1e,
                #d62976,
                #962fbf,
                #4f5bd5,
                #4b876d,
                #0d4516
            );
            font-family: Arial, sans-serif;
        }

        .container {
            width: 350px;
            margin: 40px auto;
            text-align: center;
        }

        .login-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 35px 40px;
        }

        .logo {
            font-family: cursive;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 30px;

            background: linear-gradient(
                45deg,
                #feda75,
                #fa7e1e,
                #d62976,
                #962fbf,
                #4f5bd5
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: 1px solid #dbdbdb;
            border-radius: 5px;
            background: #fafafa;
            font-size: 12px;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;

            background: linear-gradient(
                90deg,
                #4f5bd5,
                #962fbf,
                #d62976,
                #fa7e1e
            );
        }

        .or {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #737373;
            font-size: 13px;
        }

        .or::before,
        .or::after {
            content: "";
            flex: 1;
            border-top: 1px solid #dbdbdb;
        }

        .or span {
            margin: 0 15px;
        }

        .facebook {
            color: #385185;
            font-weight: bold;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot {
            display: block;
            margin-top: 20px;
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
        }

        .signup-box {
            background: white;
            border: 1px solid #dbdbdb;
            margin-top: 10px;
            padding: 20px;
            font-size: 14px;
        }

        .signup {
            color: #0095f6;
            font-weight: bold;
            text-decoration: none;
        }

        .download {
            margin-top: 20px;
            font-size: 14px;
        }

        .app {
            margin-top: 15px;
        }

        .app button {
            background: #000;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 10px 18px;
            margin: 5px;
            cursor: pointer;
        }

        footer {
            margin-top: 30px;
            color: #737373;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">Instagram</div>

            <input type="text"
                   placeholder="Phone number, username, or email">

            <input type="password"
                   placeholder="Password">

            <button class="login-btn">Log in</button>

            <div class="or">
                <span>OR</span>
            </div>

            <a href="#" class="facebook">
                ● Log in with Facebook
            </a>

            <a href="#" class="forgot">
                Forgot password?
            </a>

        </div>

        <div class="signup-box">
            Don't have an account?
            <a href="#" class="signup">Sign up</a>
        </div>

        <div class="download">
            Get the app
        </div>

        <div class="app">
            <button>Google Play</button>
            <button>App Store</button>
        </div>

        <footer>
            © 2026 Instagram Style Login Page
        </footer>

    </div>

</body>
</html>
