<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>

<body style="background-color: lightblue;">

    <form style="width: 650px; margin: 30px auto; background-color: white;
                 padding: 25px;">

        <h1 style="text-align:center;">Student Registration Form</h1>

        <label>Roll no. :</label>
        <input type="text" style="margin-left: 80px; width: 390px;"><br><br>

        <label>Student name :</label>
        <input type="text" placeholder="First Name" style="margin-left: 45px;">
        -
        <input type="text" placeholder="Last Name"><br><br>

        <label>Father's name :</label>
        <input type="text" style="margin-left: 43px; width: 390px;"><br><br>

        <label>Date of birth :</label>
        <input type="text" placeholder="Day" style="margin-left: 48px; width: 45px;">
        -
        <input type="text" placeholder="Month" style="width: 55px;">
        -
        <input type="text" placeholder="Year" style="width: 70px;">
        (DD-MM-YYYY)<br><br>

        <label>Mobile no. :</label>
        <input type="text" value="+91" style="margin-left: 68px; width: 40px;">
        -
        <input type="text" style="width: 330px;"><br><br>

        <label>Email id :</label>
        <input type="email" style="margin-left: 80px; width: 390px;"><br><br>

        <label>Password :</label>
        <input type="password" style="margin-left: 68px; width: 390px;"><br><br>

        <label>Gender :</label>
        <input type="radio" name="gender" style="margin-left: 82px;"> Male
        <input type="radio" name="gender"> Female<br><br>

        <label>Department :</label>
        <input type="checkbox" style="margin-left: 55px;"> CSE
        <input type="checkbox"> IT
        <input type="checkbox"> ECE
        <input type="checkbox"> Civil
        <input type="checkbox"> Mech<br><br>

        <label>Course :</label>
        <select style="margin-left: 80px; width: 400px;">
            <option>-- Select Current Course --</option>
            <option>B.Tech</option>
            <option>M.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
        </select><br><br>

        <label>Student photo :</label>
        <input type="file" style="margin-left: 35px;"><br><br>

        <label>City :</label>
        <input type="text" style="margin-left: 105px; width: 390px;"><br><br>

        <label>Address :</label>
        <textarea style="margin-left: 80px; width: 390px; height: 80px;"></textarea>

        <br><br>

        <div style="text-align:center;">
            <input type="submit" value="Register">
        </div>

    </form>

</body>
</html>
