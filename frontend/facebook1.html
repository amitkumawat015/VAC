<!DOCTYPE html>
<html>
<head>
    <title>Facebook Login</title>

    <style>
        body {
            margin: 0;
            background-color: #1768e2;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            text-align: center;
        }

        .logo {
            color: #010657;
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .login-box {
            background-color: rgb(107, 149, 241);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #81c1ee;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 7px 0;
            border: 1px solid #12074f;
            border-radius: 6px;
            font-size: 16px;
        }

        .login {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
        }


        .forgot {
            display: block;
            margin: 18px;
            color: #1877f2;
            text-decoration: none;
        }

        hr {
            border: 0;
            border-top: 1px solid #ddd;
        }

        .create {
            margin-top: 15px;
            padding: 13px 20px;
            background-color: #42b72a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }

        .text {
            margin-top: 25px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            facebook
        </div>

        <div class="login-box">

            <h2>Log in to Facebook</h2>

            <input type="text"
                   placeholder="Email address or phone number">

            <input type="password"
                   placeholder="Password">

            <button class="login">
                Log In
            </button>

            <a href="#" class="forgot">
                Forgotten password?
            </a>

            <hr>

            <button class="create">
                Create new account
            </button>

        </div>

        <div class="text">
            <b>Create a Page</b> for a celebrity, brand or business.
        </div>

    </div>

</body>
</html>
