<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chessboard with Hands</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #2b333e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    /* Main Container holding board & hands */
    .scene-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 140px;
    }

    /* Outer border matching the image */
    .board-frame {
      background: #ffffff;
      padding: 12px;
      border: 3px solid #1a1a1a;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 2;
    }

    .board-inner-frame {
      border: 2px solid #333333;
      padding: 8px;
    }

    /* Coordinate Letters (Top & Bottom) */
    .coords-row {
      display: grid;
      grid-template-columns: 20px repeat(8, 48px) 20px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      color: #222;
      line-height: 20px;
    }

    /* Middle Section: Numbers + 8x8 Board + Numbers */
    .board-center {
      display: flex;
      align-items: center;
    }

    .coords-col {
      display: grid;
      grid-template-rows: repeat(8, 48px);
      width: 20px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      color: #222;
      line-height: 48px;
    }

    /* 8x8 Chess Grid */
    .chessboard {
      display: grid;
      grid-template-columns: repeat(8, 48px);
      grid-template-rows: repeat(8, 48px);
      border: 2px solid #222;
    }

    .square {
      width: 48px;
      height: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      user-select: none;
    }

    /* Board Tile Colors */
    .white {
      background-color: #f7f9fa;
    }

    .black {
      background-color: #555d64;
    }

    /* Chess Pieces Styling */
    .piece-black {
      color: #111111;
      text-shadow: 0 0 1px #fff;
    }

    .piece-white {
      color: #ffffff;
      text-shadow: 
        -1px -1px 0 #111,
         1px -1px 0 #111,
        -1px  1px 0 #111,
         1px  1px 0 #111,
         0 2px 3px rgba(0,0,0,0.4);
    }

    /* ====================================================
       HANDS STYLING (Left & Right Hands Holding the Board)
       ==================================================== */
    .hand {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      z-index: 5;
    }

    .arm {
      width: 110px;
      height: 150px;
      background: #1e1e1e; /* Dark sleeve */
      border-radius: 8px;
    }

    .palm {
      width: 40px;
      height: 125px;
      background: #e8bca0;
      border-top: 1px solid #c99a80;
      border-bottom: 1px solid #c99a80;
    }

    .fingers {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .finger {
      width: 62px;
      height: 18px;
      background: linear-gradient(to bottom, #f3cdb5, #e0b093);
      border: 1px solid #ba8c73;
      box-shadow: 1px 2px 4px rgba(0, 0, 0, 0.25);
    }

    /* Left Hand Placed on the Left Border */
    .left-hand {
      left: 30px;
    }

    .left-hand .palm {
      border-radius: 12px 0 0 12px;
    }

    .left-hand .finger {
      border-radius: 0 12px 12px 0;
      margin-left: -4px;
    }

    /* Right Hand Placed on the Right Border */
    .right-hand {
      right: 30px;
      flex-direction: row-reverse;
    }

    .right-hand .palm {
      border-radius: 0 12px 12px 0;
    }

    .right-hand .finger {
      border-radius: 12px 0 0 12px;
      margin-right: -4px;
    }
  </style>
</head>
<body>

  <div class="scene-container">
    
    <!-- LEFT HAND -->
    <div class="hand left-hand">
      <div class="arm"></div>
      <div class="palm"></div>
      <div class="fingers">
        <div class="finger"></div>
        <div class="finger"></div>
        <div class="finger"></div>
        <div class="finger"></div>
      </div>
    </div>

    <!-- CHESS BOARD -->
    <div class="board-frame">
      <div class="board-inner-frame">
        
        <!-- Top Letters: A - H -->
        <div class="coords-row">
          <div></div>
          <div>A</div><div>B</div><div>C</div><div>D</div><div>E</div><div>F</div><div>G</div><div>H</div>
          <div></div>
        </div>

        <!-- Middle Section: Numbers + Squares + Numbers -->
        <div class="board-center">
          
          <!-- Left Numbers (8 to 1) -->
          <div class="coords-col">
            <div>8</div><div>7</div><div>6</div><div>5</div><div>4</div><div>3</div><div>2</div><div>1</div>
          </div>

          <!-- 64 Squares (8x8) -->
          <div class="chessboard">
            
            <!-- Row 8 (Black Major Pieces) -->
            <div class="square white"><span class="piece-black">&#9820;</span></div>
            <div class="square black"><span class="piece-black">&#9822;</span></div>
            <div class="square white"><span class="piece-black">&#9821;</span></div>
            <div class="square black"><span class="piece-black">&#9819;</span></div>
            <div class="square white"><span class="piece-black">&#9818;</span></div>
            <div class="square black"><span class="piece-black">&#9821;</span></div>
            <div class="square white"><span class="piece-black">&#9822;</span></div>
            <div class="square black"><span class="piece-black">&#9820;</span></div>

            <!-- Row 7 (Black Pawns) -->
            <div class="square black"><span class="piece-black">&#9823;</span></div>
            <div class="square white"><span class="piece-black">&#9823;</span></div>
            <div class="square black"><span class="piece-black">&#9823;</span></div>
            <div class="square white"><span class="piece-black">&#9823;</span></div>
            <div class="square black"><span class="piece-black">&#9823;</span></div>
            <div class="square white"><span class="piece-black">&#9823;</span></div>
            <div class="square black"><span class="piece-black">&#9823;</span></div>
            <div class="square white"><span class="piece-black">&#9823;</span></div>

            <!-- Row 6 (Empty) -->
            <div class="square white"></div>
            <div class="square black"></div>
            <div class="square white"></div>
            <div class="square black"></div>
            <div class="square white"></div>
            <div class="square black"></div>
            <div class="square white"></div>
            <div class="square black"></div>

            <!-- Row 5 (Empty) -->
            <div class="square black"></div>
            <div class="square white"></div>
            <div class="square black"></div>
            <div class="square white"></div>
            <div class="square black"></div>
            <div class="square white"></div>
            <div class="square black"></div>
            <div class="square white"></div>

            <!-- Row 4 (Empty) -->
            <div class="square white"></div>
            <div class="square black"></div>
            <div class="square white"></div>
            <div class="square black"></div>
            <div class="square white"></div>
            <div class="square black"></div>
            <div class="square white"></div>
            <div class="square black"></div>

            <!-- Row 3 (Empty) -->
            <div class="square black"></div>
            <div class="square white"></div>
            <div class="square black"></div>
            <div class="square white"></div>
            <div class="square black"></div>
            <div class="square white"></div>
            <div class="square black"></div>
            <div class="square white"></div>

            <!-- Row 2 (White Pawns) -->
            <div class="square white"><span class="piece-white">&#9817;</span></div>
            <div class="square black"><span class="piece-white">&#9817;</span></div>
            <div class="square white"><span class="piece-white">&#9817;</span></div>
            <div class="square black"><span class="piece-white">&#9817;</span></div>
            <div class="square white"><span class="piece-white">&#9817;</span></div>
            <div class="square black"><span class="piece-white">&#9817;</span></div>
            <div class="square white"><span class="piece-white">&#9817;</span></div>
            <div class="square black"><span class="piece-white">&#9817;</span></div>

            <!-- Row 1 (White Major Pieces) -->
            <div class="square black"><span class="piece-white">&#9814;</span></div>
            <div class="square white"><span class="piece-white">&#9816;</span></div>
            <div class="square black"><span class="piece-white">&#9815;</span></div>
            <div class="square white"><span class="piece-white">&#9813;</span></div>
            <div class="square black"><span class="piece-white">&#9812;</span></div>
            <div class="square white"><span class="piece-white">&#9815;</span></div>
            <div class="square black"><span class="piece-white">&#9816;</span></div>
            <div class="square white"><span class="piece-white">&#9814;</span></div>

          </div>

          <!-- Right Numbers (8 to 1) -->
          <div class="coords-col">
            <div>8</div><div>7</div><div>6</div><div>5</div><div>4</div><div>3</div><div>2</div><div>1</div>
          </div>

        </div>

        <!-- Bottom Letters: A - H -->
        <div class="coords-row">
          <div></div>
          <div>A</div><div>B</div><div>C</div><div>D</div><div>E</div><div>F</div><div>G</div><div>H</div>
          <div></div>
        </div>

      </div>
    </div>

    <!-- RIGHT HAND -->
    <div class="hand right-hand">
      <div class="arm"></div>
      <div class="palm"></div>
      <div class="fingers">
        <div class="finger"></div>
        <div class="finger"></div>
        <div class="finger"></div>
        <div class="finger"></div>
      </div>
    </div>

  </div>

</body>
</html>
